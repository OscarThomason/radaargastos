<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Radar de Pagos</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <meta name="theme-color" content="#F8FAF7">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Radar">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #F8FAF7;
      color: #0F172A;
      font-family: 'Sora', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .init-loader-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #F8FAF7;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      box-sizing: border-box;
      z-index: 99999;
    }

    .init-loader-card {
      background: #FFFFFF;
      border: 1.5px solid #0F172A;
      border-radius: 20px;
      padding: 30px 24px;
      box-shadow: 4px 4px 0px #0F172A, 0 16px 32px rgba(0,0,0,0.06);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 320px;
      width: 100%;
      transform: rotate(-0.5deg);
    }

    .init-notebook {
      position: relative;
      width: 130px;
      height: 150px;
      background: #FFFFFF;
      border: 2px solid #0F172A;
      border-radius: 4px 14px 14px 4px;
      box-shadow: 3px 3px 0px #0F172A;
      margin-bottom: 20px;
      display: flex;
      overflow: hidden;
    }

    .init-spine {
      width: 20px;
      background: #F1F5F9;
      border-right: 1.5px solid #0F172A;
      display: flex;
      flex-direction: column;
      justify-content: space-around;
      align-items: center;
      padding: 8px 0;
    }

    .init-ring {
      width: 10px;
      height: 10px;
      border: 2px solid #0F172A;
      border-radius: 50%;
      background: #FFFFFF;
    }

    .init-page {
      flex: 1;
      position: relative;
      background: #FFFFFF;
      background-image: linear-gradient(rgba(15, 23, 42, 0.08) 1px, transparent 1px);
      background-size: 100% 22px;
      background-position: 0 10px;
      padding: 10px 12px;
    }

    .init-margin {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 10px;
      width: 2px;
      background: #E53935;
    }

    .init-lines {
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-top: 4px;
      margin-left: 6px;
    }

    .init-line {
      height: 5px;
      border-radius: 3px;
      background: #0F172A;
      width: 0%;
      animation: initFillLine 1.5s infinite ease-in-out;
    }

    .init-line-1 { animation-delay: 0.1s; }
    .init-line-2 { animation-delay: 0.3s; }
    .init-line-3 { animation-delay: 0.5s; }
    .init-line-4 { animation-delay: 0.7s; }

    @keyframes initFillLine {
      0% { width: 0%; opacity: 0.3; }
      50% { width: 85%; opacity: 1; }
      100% { width: 100%; opacity: 1; }
    }

    .init-pencil {
      position: absolute;
      bottom: 10px;
      right: 8px;
      font-size: 22px;
      animation: initPencil 1.5s infinite ease-in-out;
    }

    @keyframes initPencil {
      0%, 100% { transform: translate(0, 0) rotate(0deg); }
      50% { transform: translate(-12px, -24px) rotate(-15deg); }
    }

    .init-title {
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.04em;
      margin: 0 0 6px 0;
      color: #0F172A;
      text-transform: uppercase;
    }

    .init-sub {
      font-size: 11px;
      color: #64748B;
      margin: 0 0 16px 0;
    }

    .init-track {
      width: 100%;
      height: 5px;
      background: #E2E8F0;
      border: 1px solid #0F172A;
      border-radius: 3px;
      overflow: hidden;
    }

    .init-bar {
      height: 100%;
      background: #0F172A;
      width: 0%;
      animation: initBar 1.5s ease-in-out infinite;
    }

    @keyframes initBar {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <app-root>
    <div class="init-loader-container">
      <div class="init-loader-card">
        <div class="init-notebook">
          <div class="init-spine">
            <span class="init-ring"></span>
            <span class="init-ring"></span>
            <span class="init-ring"></span>
            <span class="init-ring"></span>
          </div>
          <div class="init-page">
            <div class="init-margin"></div>
            <div class="init-lines">
              <div class="init-line init-line-1"></div>
              <div class="init-line init-line-2"></div>
              <div class="init-line init-line-3"></div>
              <div class="init-line init-line-4"></div>
            </div>
            <div class="init-pencil">✍️</div>
          </div>
        </div>

        <h3 class="init-title">ABRIENDO TU BITÁCORA...</h3>
        <p class="init-sub">Cargando tus finanzas al día</p>

        <div class="init-track">
          <div class="init-bar"></div>
        </div>
      </div>
    </div>
  </app-root>
</body>
</html>
